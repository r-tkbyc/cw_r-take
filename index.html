<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15231f" />
    <meta name="application-version" content="1.0.1" />
    <meta
      name="description"
      content="プテラノドン組立キットのアニメーションを自由な角度から確認できる3Dビューア"
    />
    <title>プテラノドン 3D組立ビューア</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/x_ite@15.1.10/dist/x_ite.min.js"
    ></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">S&amp;D スチレン恐竜組立キット</p>
          <h1>プテラノドン</h1>
        </div>
        <div class="header-meta">
          <span class="version-badge">ver 1.0.1</span>
          <span class="format-badge">3D / VRML</span>
        </div>
      </header>

      <section class="viewer-card" aria-label="プテラノドン3Dビューア">
        <div class="viewer-stage" id="viewer-stage">
          <x3d-canvas
            id="model-viewer"
            class="browser"
            data-model-url="./S＆D‗スチレン恐竜組立キット_プテラノドン_001_05.WRL"
            contentScale="auto"
            update="auto"
            splashScreen="false"
            notifications="false"
            contextMenu="true"
            aria-label="ドラッグしてプテラノドンを回転できます"
          >
            <p class="fallback-message">
              このブラウザでは3D表示を利用できません。最新版のChrome、Edge、Firefox、Safariでお試しください。
            </p>
          </x3d-canvas>

          <div class="loading-panel" id="loading-panel" role="status" aria-live="polite">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span id="loading-message">3Dモデルを読み込んでいます…</span>
          </div>

          <div class="viewer-hint" id="viewer-hint">
            <span class="desktop-hint">ドラッグで回転 ・ ホイールでズーム</span>
            <span class="mobile-hint">1本指で回転 ・ ピンチでズーム</span>
          </div>
        </div>

        <div class="control-panel">
          <div class="timeline-row">
            <label class="sr-only" for="timeline">アニメーションの再生位置</label>
            <input
              id="timeline"
              class="timeline"
              type="range"
              min="0"
              max="1000"
              step="1"
              value="0"
              disabled
            />
            <output id="time-display" for="timeline">0:00 / 0:24</output>
          </div>

          <div class="button-row">
            <button id="play-pause" class="button button-primary" type="button" disabled>
              <span class="button-icon" aria-hidden="true">Ⅱ</span>
              <span class="button-label">一時停止</span>
            </button>
            <button id="restart" class="button" type="button" disabled>
              <span class="button-icon" aria-hidden="true">↺</span>
              <span>先頭へ</span>
            </button>
            <button id="reset-view" class="button" type="button" disabled>
              <span class="button-icon" aria-hidden="true">◎</span>
              <span>視点を戻す</span>
            </button>
          </div>
        </div>
      </section>

      <section class="instructions" aria-labelledby="instructions-title">
        <h2 id="instructions-title">操作方法</h2>
        <div class="instruction-grid">
          <div>
            <strong>回転</strong>
            <span>画面をドラッグ</span>
          </div>
          <div>
            <strong>拡大・縮小</strong>
            <span>ホイール／ピンチ</span>
          </div>
          <div>
            <strong>移動</strong>
            <span>右ドラッグ／2本指</span>
          </div>
        </div>
      </section>

      <footer>
        <p>WebGL対応ブラウザでご覧ください。</p>
      </footer>
    </main>
  </body>
</html>
